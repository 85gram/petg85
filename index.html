<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>츠키길드 랜덤 뽑기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;600;800&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            font-family: 'Pretendard', 'Gowun Dodum', sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #080a14;
            color: #e2e8f0;
            overflow-x: hidden;
            user-select: none;
        }

        /* Ambient Cosmic Background */
        .cosmic-bg {
            background: radial-gradient(circle at 50% 0%, #1e1338 0%, #0c0d1a 50%, #05060c 100%);
            min-height: 100vh;
            position: relative;
        }

        /* Nebula Aurora Overlay */
        .aurora {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 60%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            pointer-events: none;
            filter: blur(40px);
        }

        /* Twinkling Stars */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) infinite ease-in-out var(--delay, 0s);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.4); box-shadow: 0 0 10px #fff, 0 0 15px #a855f7; }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(18, 20, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* Title Glow */
        .header-glow {
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 40%, #c084fc 70%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
        }

        /* 3-Row Visible Slot Outer Container */
        .slot-frame {
            background: linear-gradient(180deg, rgba(15, 17, 32, 0.95) 0%, rgba(8, 9, 20, 0.98) 100%);
            border: 2px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Animated Border Light */
        .slot-frame::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            padding: 2px;
            background: linear-gradient(135deg, #c084fc, #38bdf8, #f43f5e, #c084fc);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
            animation: borderRotate 6s linear infinite;
        }

        @keyframes borderRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Slot Viewport (3-Row Height: 90px * 3 = 270px) */
        .slot-viewport {
            height: 270px;
            overflow: hidden;
            position: relative;
        }

        .reel-strip {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            will-change: transform;
            /* 부드러운 전환 효과 추가 */
            transition: transform 0.4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        /* Single Reel Slot Row */
        .reel-item {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 800;
            color: #cbd5e1;
            padding: 0 1.5rem;
            text-align: center;
            letter-spacing: 0.02em;
        }

        /* Center Winner Highlight Frame */
        .center-highlight-box {
            position: absolute;
            top: 90px;
            left: 8px;
            right: 8px;
            height: 90px;
            border-top: 2px solid #f59e0b;
            border-bottom: 2px solid #f59e0b;
            background: linear-gradient(90deg, 
                rgba(245, 158, 11, 0.12) 0%, 
                rgba(168, 85, 247, 0.18) 50%, 
                rgba(245, 158, 11, 0.12) 100%
            );
            box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.25), 0 0 15px rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            pointer-events: none;
            z-index: 10;
        }

        .pointer-arrow-left, .pointer-arrow-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            z-index: 12;
            filter: drop-shadow(0 0 6px #f59e0b);
        }

        .pointer-arrow-left {
            left: 16px;
            border-left: 14px solid #f59e0b;
        }

        .pointer-arrow-right {
            right: 16px;
            border-right: 14px solid #f59e0b;
        }

        .reel-vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, 
                rgba(8, 9, 20, 0.85) 0%, 
                rgba(8, 9, 20, 0.15) 30%, 
                rgba(8, 9, 20, 0.15) 70%, 
                rgba(8, 9, 20, 0.85) 100%
            );
            pointer-events: none;
            z-index: 11;
        }

        /* Neon Button Styling */
        .btn-neon {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #4f46e5 100%);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), 0 4px 12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), 0 8px 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #b666ff 0%, #8b5cf6 50%, #6366f1 100%);
        }

        .btn-neon:active:not(:disabled) {
            transform: translateY(1px) scale(0.99);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .btn-neon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Modal Animation */
        @keyframes modalShow {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-anim {
            animation: modalShow 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="cosmic-bg flex flex-col min-h-screen justify-between items-center p-4 sm:p-8">

    <script>
        // High-precision Web Audio Synthesizer for Realistic Slot Clicks & Chimes
        class RealisticSlotAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            playMechanicalTick(speedFactor = 1.0) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                const baseFreq = 480 + (Math.random() * 40 - 20);
                osc.frequency.setValueAtTime(baseFreq * Math.min(speedFactor, 1.2), now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.035);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.035);
            }

            playSnapLock() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }

            playWinChime() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [
                    { f: 523.25, delay: 0.00, duration: 0.15 },
                    { f: 659.25, delay: 0.10, duration: 0.15 },
                    { f: 783.99, delay: 0.20, duration: 0.15 },
                    { f: 1046.50, delay: 0.32, duration: 0.50 }
                ];

                notes.forEach(n => {
                    const now = this.ctx.currentTime + n.delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(n.f, now);

                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + n.duration);
                });
            }
        }

        // Global State & Setup
        const defaultParticipants = [
            "PETG", "20준", "일훈이", "김다응", 
            "찌하아", "레위니아", "흐아아앙아", "항공스포츠", "폴리수프", "비트토랭이", "초보임요",
        ];

        let participants = [...defaultParticipants];
        let winnerHistory = [];
        let isSpinning = false;
        let lastWinner = null;
        const soundEngine = new RealisticSlotAudio();

        // DOM Handles
        const spinBtn = document.getElementById('spin-btn');
        const slotStrip = document.getElementById('slot-strip');
        const nameInput = document.getElementById('name-input');
        const addNameBtn = document.getElementById('add-name-btn');
        const participantTagsContainer = document.getElementById('participant-tags');
        const participantCountBadge = document.getElementById('participant-count-badge');
        const btnResetDefault = document.getElementById('btn-reset-default');
        const btnClearAll = document.getElementById('btn-clear-all');
        const bulkNameInput = document.getElementById('bulk-name-input');
        const btnApplyBulk = document.getElementById('btn-apply-bulk');
        const historyList = document.getElementById('history-list');
        const btnClearHistory = document.getElementById('btn-clear-history');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');

        const winnerModal = document.getElementById('winner-modal');
        const winnerDisplayName = document.getElementById('winner-display-name');
        const chkRemoveWinner = document.getElementById('chk-remove-winner');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        const ROW_HEIGHT = 90;

        function createStars() {
            const field = document.getElementById('star-field');
            field.innerHTML = '';
            for (let i = 0; i < 70; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
                star.style.setProperty('--delay', `${Math.random() * 3}s`);
                field.appendChild(star);
            }
        }

        function renderParticipants() {
            participantTagsContainer.innerHTML = '';
            participantCountBadge.innerText = `총 ${participants.length}명`;

            if (participants.length === 0) {
                participantTagsContainer.innerHTML = `
                    <div class="text-xs text-slate-500 flex items-center justify-center w-full h-full py-4">
                        등록된 길드원이 없습니다. 위 입력란에서 이름을 추가해 주세요.
                    </div>`;
                return;
            }

            participants.forEach((name, index) => {
                const tag = document.createElement('div');
                tag.className = 'bg-slate-900/90 hover:bg-red-950/80 border border-slate-700 hover:border-red-600/80 text-slate-200 hover:text-red-200 text-xs px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 cursor-pointer transition shadow-sm group';
                tag.innerHTML = `
                    <span>✨ ${escapeHtml(name)}</span>
                    <span class="text-slate-500 group-hover:text-red-400 font-bold ml-1">×</span>
                `;
                tag.onclick = () => removeParticipant(index);
                participantTagsContainer.appendChild(tag);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function addName(inputStr) {
            if (!inputStr) return;
            const names = inputStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
            let added = false;
            names.forEach(n => {
                if (n && !participants.includes(n)) {
                    participants.push(n);
                    added = true;
                }
            });
            if (added) renderParticipants();
        }

        function removeParticipant(index) {
            participants.splice(index, 1);
            renderParticipants();
        }

        function startSynchronizedSpin() {
            if (isSpinning) return;

            if (participants.length === 0) {
                alert("참여 명단이 없습니다. 최소 1명 이상의 길드원 이름을 적어주세요!");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;

            const winnerIdx = Math.floor(Math.random() * participants.length);
            lastWinner = participants[winnerIdx];

            // 0 ~ 3칸 사이 랜덤 추가 칸수 결정
            const extraSteps = Math.floor(Math.random() * 4); // 0, 1, 2, 3

            const baseItems = 45;
            const totalItems = baseItems + extraSteps;

            const targetNeighborTop = participants[(winnerIdx - 1 + participants.length) % participants.length];
            const targetNeighborBottom = participants[(winnerIdx + 1) % participants.length];

            slotStrip.innerHTML = '';

            for (let i = 0; i < totalItems; i++) {
                const item = document.createElement('div');
                item.className = 'reel-item';

                if (i === totalItems - 3) {
                    item.innerText = targetNeighborTop;
                    item.classList.add('text-slate-400');
                } else if (i === totalItems - 2) {
                    item.innerText = lastWinner;
                    item.dataset.isWinnerCell = "true"; 
                    item.classList.add('text-slate-200'); 
                } else if (i === totalItems - 1) {
                    item.innerText = targetNeighborBottom;
                    item.classList.add('text-slate-400');
                } else {
                    const randomName = participants[Math.floor(Math.random() * participants.length)];
                    item.innerText = randomName;
                }

                slotStrip.appendChild(item);
            }

            const targetY = (totalItems - 3) * ROW_HEIGHT; 
            let currentY = 0;
            let lastTickRow = 0;

            const totalDuration = 4500; 
            const startTime = performance.now();

            // 1단계: 고속 회전 구간
            function animateFastSpin(now) {
                const elapsed = now - startTime;
                let progress = Math.min(elapsed / totalDuration, 1.0);

                const easedProgress = 1 - Math.pow(1 - progress, 3);
                const fastTargetY = (baseItems - 3) * ROW_HEIGHT;
                currentY = easedProgress * fastTargetY;

                slotStrip.style.transform = `translateY(-${currentY}px)`;

                const currentRow = Math.floor(currentY / ROW_HEIGHT);
                if (currentRow > lastTickRow) {
                    soundEngine.playMechanicalTick(0.7);
                    lastTickRow = currentRow;
                }

                if (progress < 1.0) {
                    requestAnimationFrame(animateFastSpin);
                } else {
                    // 고속 회전 완료 후 CSS transition을 활성화하여 묵직하고 부드러운 감속 효과 적용
                    slotStrip.style.transition = 'transform 0.4s cubic-bezier(0.15, 0.85, 0.35, 1)';
                    executeExtraSteps(extraSteps, lastTickRow);
                }
            }

            // 2단계: 0~3칸 추가로 묵직하고 천천히 '둑... 둑...' 전진
            function executeExtraSteps(remainingSteps, currentRowIndex) {
                if (remainingSteps <= 0) {
                    slotStrip.style.transform = `translateY(-${targetY}px)`;
                    soundEngine.playSnapLock();

                    const winnerCell = slotStrip.querySelector('[data-is-winner-cell="true"]');
                    if (winnerCell) {
                        winnerCell.classList.remove('text-slate-200');
                        winnerCell.innerText = `👑 ${lastWinner}`;
                        winnerCell.classList.add('text-amber-300', 'font-black', 'text-2xl', 'sm:text-3xl', 'drop-shadow-[0_0_15px_rgba(245,158,11,0.7)]');
                    }

                    setTimeout(() => {
                        isSpinning = false;
                        spinBtn.disabled = false;
                        // 다음 회전을 위해 transition 초기화
                        slotStrip.style.transition = 'none';

                        addWinnerToHistory(lastWinner);
                        soundEngine.playWinChime();
                        showWinnerModal(lastWinner);
                        triggerConfetti();
                    }, 500);
                    return;
                }

                currentRowIndex++;
                const nextStepY = currentRowIndex * ROW_HEIGHT;
                slotStrip.style.transform = `translateY(-${nextStepY}px)`;
                
                soundEngine.playMechanicalTick(0.3);

                // 간격을 380밀리초로 늘려 훨씬 여유롭고 묵직한 둑-둑 느낌 구현
                setTimeout(() => {
                    executeExtraSteps(remainingSteps - 1, currentRowIndex);
                }, 380); 
            }

            // 회전 시작 전 transition 제거 (고속 회전 시 부드러운 밀림 방지)
            slotStrip.style.transition = 'none';
            requestAnimationFrame(animateFastSpin);
        }

        function addWinnerToHistory(winnerName) {
            const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            winnerHistory.unshift({ name: winnerName, time: timeStr });
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if (winnerHistory.length === 0) {
                historyList.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">아직 당첨자가 없습니다.</div>';
                return;
            }

            winnerHistory.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-slate-900/60 border border-slate-800/80 p-2 rounded-xl text-xs';
                row.innerHTML = `
                    <div class="flex items-center truncate">
                        <span class="text-amber-400 font-bold mr-1.5">#${winnerHistory.length - idx}</span>
                        <span class="text-slate-100 font-semibold truncate">${escapeHtml(item.name)}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 shrink-0">${item.time}</span>
                `;
                historyList.appendChild(row);
            });
        }

        function showWinnerModal(name) {
            winnerDisplayName.innerText = name;
            chkRemoveWinner.checked = false;
            winnerModal.classList.remove('hidden');
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 130,
                    spread: 85,
                    origin: { y: 0.55 }
                });
            }
        }

        spinBtn.addEventListener('click', startSynchronizedSpin);

        addNameBtn.addEventListener('click', () => {
            addName(nameInput.value);
            nameInput.value = '';
            nameInput.focus();
        });

        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addName(nameInput.value);
                nameInput.value = '';
            }
        });

        btnResetDefault.addEventListener('click', () => {
            participants = [...defaultParticipants];
            renderParticipants();
        });

        btnClearAll.addEventListener('click', () => {
            participants = [];
            renderParticipants();
        });

        btnApplyBulk.addEventListener('click', () => {
            const text = bulkNameInput.value;
            if (text.trim()) {
                const list = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                list.forEach(n => {
                    if (!participants.includes(n)) participants.push(n);
                });
                renderParticipants();
                bulkNameInput.value = '';
            }
        });

        btnClearHistory.addEventListener('click', () => {
            winnerHistory = [];
            renderHistory();
        });

        soundToggleBtn.addEventListener('click', () => {
            const isMuted = soundEngine.toggleMute();
            soundIcon.innerText = isMuted ? '🔇' : '🔊';
            soundText.innerText = isMuted ? '음소거됨' : '사운드 켜짐';
        });

        modalCloseBtn.addEventListener('click', () => {
            if (chkRemoveWinner.checked && lastWinner) {
                const index = participants.indexOf(lastWinner);
                if (index !== -1) {
                    removeParticipant(index);
                }
            }
            winnerModal.classList.add('hidden');
        });

        window.addEventListener('load', () => {
            createStars();
            renderParticipants();
        });
    </script>
</body>
</html>
